<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP地址查询工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-section {
            display: flex;
            margin-bottom: 30px;
            gap: 10px;
        }
        
        input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        input:focus {
            border-color: #2575fc;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.2);
        }
        
        button {
            background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result-section {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
            display: none;
        }
        
        .result-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #2575fc;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
        }
        
        .info-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            word-break: break-all;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 5px solid rgba(37, 117, 252, 0.2);
            border-radius: 50%;
            border-top: 5px solid #2575fc;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background-color: #ffe6e6;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .error.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #e0e0e0;
            margin-top: 20px;
        }
        
        @media (max-width: 600px) {
            .input-section {
                flex-direction: column;
            }
            
            button {
                padding: 15px;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>IP地址查询工具</h1>
            <p class="subtitle">快速查询IP地址的详细信息</p>
        </header>
        
        <div class="content">
            <div class="input-section">
                <input type="text" id="ip-input" placeholder="输入IP地址 (留空查询本机IP)">
                <button id="query-btn">查询</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在查询IP地址信息...</p>
            </div>
            
            <div class="error" id="error">
                <p id="error-message"></p>
            </div>
            
            <div class="result-section" id="result">
                <h2 class="result-title">查询结果</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">IP地址</span>
                        <span class="info-value" id="ip-address">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">地理位置</span>
                        <span class="info-value" id="location">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">城市</span>
                        <span class="info-value" id="city">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">地区</span>
                        <span class="info-value" id="region">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">国家</span>
                        <span class="info-value" id="country">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">邮政编码</span>
                        <span class="info-value" id="postal">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">时区</span>
                        <span class="info-value" id="timezone">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">ISP提供商</span>
                        <span class="info-value" id="isp">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>本工具使用第三方API获取IP地址信息 | 数据仅供参考</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ipInput = document.getElementById('ip-input');
            const queryBtn = document.getElementById('query-btn');
            const resultSection = document.getElementById('result');
            const loadingSection = document.getElementById('loading');
            const errorSection = document.getElementById('error');
            const errorMessage = document.getElementById('error-message');
            
            // 查询本机IP
            queryIP('');
            
            // 绑定查询按钮事件
            queryBtn.addEventListener('click', function() {
                const ip = ipInput.value.trim();
                queryIP(ip);
            });
            
            // 绑定回车键事件
            ipInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    queryIP(ipInput.value.trim());
                }
            });
            
            function queryIP(ip) {
                // 显示加载状态
                loadingSection.classList.add('active');
                resultSection.classList.remove('active');
                errorSection.classList.remove('active');
                
                // 构建API URL
                let apiUrl = 'https://ipapi.co';
                if (ip) {
                    apiUrl += `/${ip}/json/`;
                } else {
                    apiUrl += '/json/';
                }
                
                // 发起请求
                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('网络响应不正常');
                        }
                        return response.json();
                    })
                    .then(data => {
                        // 处理响应数据
                        displayResult(data);
                    })
                    .catch(error => {
                        // 处理错误
                        showError('查询失败: ' + error.message);
                    })
                    .finally(() => {
                        // 隐藏加载状态
                        loadingSection.classList.remove('active');
                    });
            }
            
            function displayResult(data) {
                // 更新结果区域
                document.getElementById('ip-address').textContent = data.ip || '-';
                document.getElementById('location').textContent = `${data.city || '-'}, ${data.region || '-'}`;
                document.getElementById('city').textContent = data.city || '-';
                document.getElementById('region').textContent = data.region || '-';
                document.getElementById('country').textContent = data.country_name || '-';
                document.getElementById('postal').textContent = data.postal || '-';
                document.getElementById('timezone').textContent = data.timezone || '-';
                document.getElementById('isp').textContent = data.org || '-';
                
                // 显示结果区域
                resultSection.classList.add('active');
            }
            
            function showError(message) {
                errorMessage.textContent = message;
                errorSection.classList.add('active');
            }
        });
    </script>
</body>
</html>
